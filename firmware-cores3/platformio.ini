[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; Disabled per Grok's recommendation: native USB CDC contention with the
    ; BLE radio on ESP32-S3 + Bluedroid is the prime suspect for the
    ; asymmetric-connection bug. Removing CDC isolates whether the issue is
    ; USB-contention vs deeper Bluedroid quirks. Side effect: no USB serial
    ; output for debug — screen + daemon log are our only feedback.
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified @ ^0.2.5
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
